<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories Collection</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #121212; 
  color: #ffffff; 
}

/* BACKGROUND IMAGE */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('happy.webp'); 
  background-size: cover;
  background-position: center;
  opacity: 0.3; 
  z-index: -1;
}

.center-btn-container {
  display: flex;
  flex-direction: column; 
  align-items: center;
  margin-top: 38px;
  gap: 225px;
  width: 100%;
}

.ethereal-btn{
  padding: 19px 45px;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(145deg,#9c27b0,#3f51b5);
  border: none;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: 0 8px 15px rgba(0,0,0,0.4);
  transition: all 0.2s ease;
}
.ethereal-btn:active {
  transform: translateY(2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.4);
}

.overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 52.5%;
  margin: 15px;
  display: none;
  z-index: 999; /* Lower than audio box */
}

.overlay img{
  width: 100%;
  border-radius: 9px;
}

/* --------------------------
AUDIO BOX - FULL WIDTH & HIGH Z-INDEX
--------------------------- */
.audio-box{
  margin-top: 20px;
  display: none;
  width: 95%; /* Almost full page width */
  max-width: none; /* Remove max limit so it can expand fully */
  box-sizing: border-box;
  padding: 0 10px;
  position: relative;
  z-index: 1050; /* Higher than overlay - appears above everything */
}

/* --------------------------
AUDIO PLAYER - FILLS FULL WIDTH
LIGHT 3D STYLE
--------------------------- */
audio {
  width: 390px; /* 100% of its container = 95% of page */
  height: 58px;
  border-radius: 12px;
  background: linear-gradient(145deg, #f8fbff, #e6f0ff);
  box-shadow: 
    4px 4px 8px rgba(0,0,0,0.15),
    -4px -4px 8px rgba(255,255,255,0.9),
    inset 2px 2px 4px rgba(255,255,255,0.95),
    inset -2px -2px 4px rgba(0,0,0,0.03);
}

/* Custom styling for Chrome/Edge/Safari */
audio::-webkit-media-controls-panel {
  background: linear-gradient(145deg, #f8fbff, #e6f0ff);
  border-radius: 12px;
  box-shadow: inset 2px 2px 5px rgba(255,255,255,0.9);
}

audio::-webkit-media-controls-timeline {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(145deg, #dce6f8, #cdd8f0);
  box-shadow: 
    inset 2px 2px 4px rgba(0,0,0,0.12),
    inset -2px -2px 4px rgba(255,255,255,0.75);
}

audio::-webkit-media-controls-timeline::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, #84e0ff, #b498ff);
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.18);
  height: 100%;
}

audio::-webkit-media-controls-timeline::-webkit-slider-thumb {
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffffff, #eef4ff);
  box-shadow: 
    0 3px 7px rgba(0,0,0,0.22),
    inset 1px 1px 2px rgba(255,255,255,0.95);
  margin-top: -3.5px;
  border: 1px solid #b8c8f0;
}

/* Firefox styling */
audio::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(145deg, #dce6f8, #cdd8f0);
  box-shadow: inset 2px 2px 4px rgba(0,0,0,0.12);
}

audio::-moz-range-progress {
  background: linear-gradient(90deg, #84e0ff, #b498ff);
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.18);
}

audio::-moz-range-thumb {
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 3px 7px rgba(0,0,0,0.22);
  border: none;
}
</style>
</head>
<body>

<marquee><h2>A Hi-Tech Love Story - Awe factor 8/10 ❤️❤️❤️💓🥹</h2></marquee>

<div class="center-btn-container">

  <!-- FIRST BUTTON GROUP -->
  <div>
    <button class="ethereal-btn" onclick="playAudio1()">Fallen Angel</button>
    <div class="audio-box" id="audioBox1">
      <audio id="audio1" controls>
        <source src="angel.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      
    </div>
  </div>

  <!-- SECOND BUTTON GROUP -->
  <div>
    <button class="ethereal-btn" onclick="playAudio2()">The Missing-You Syndrome</button>
    <div class="audio-box" id="audioBox2">
      <audio id="audio2" controls>
        <source src="empress.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      
    </div>
  </div>

</div>

<!-- IMAGE OVERLAY -->
<div class="overlay" id="overlay">
  <img src="empress.gif" alt="Story Image">
</div>

<script>
function playAudio1(){
  const audio = document.getElementById('audio1');
  const box = document.getElementById('audioBox1');
  const overlay = document.getElementById('overlay');
  
  overlay.style.display = "block";
  box.style.display = "block";
  audio.currentTime = 0;
  audio.play();
}

function playAudio2(){
  const audio = document.getElementById('audio2');
  const box = document.getElementById('audioBox2');
  const overlay = document.getElementById('overlay');
  
  overlay.style.display = "block";
  box.style.display = "block";
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
